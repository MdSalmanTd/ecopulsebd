<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | EcoPulse BD</title>
    <link rel="stylesheet" href="css/sign-in.css">

      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


</head>
<body>
     <div class="page-container">

        <header class="navbar">

            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 65 55" fill="none">
                    <path d="M31 48C10 43 2 28 3 8C22 10 35 23 31 48Z" fill="#65C849"/>
                    <path d="M31 48C27 22 39 5 62 1C62 25 50 42 31 48Z" fill="#39AD43"/>
                    <path d="M31 48L31 22" stroke="white" stroke-width="1.5"/>
                </svg>
                  <h2>EcoPulse <span>BD</span></h2>
            </div>

            <nav class="nav-right">

                <div class="language">
                    <a href="#" class="active">EN</a>
                    <span>|</span>
                    <a href="#">বাংলা</a>
                </div>

                <div class="nav-divider"></div>

                <a href="#login-card" class="login-link">
    <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM3 21v-2c0-3.3 3.8-5.5 9-5.5s9 2.2 9 5.5v2H3Z"/>
    </svg>
    Login / Sign In
</a>

            </nav>
        </header>
          <main class="main-content">

            <section class="hero-section">

                <div class="hero-text">

                    <h1>
                        Know your air.<br>
                        Act with your<br>
                        <span>neighbours.</span>
                    </h1>

                    <p class="subtitle">
                        A cleaner Bangladesh starts with you.
                    </p>

                </div>


                <div class="info-cards">

                    <div class="info-card">

                        <svg viewBox="0 0 40 40" fill="none">
                            <path d="M19 35C5 30 3 20 7 8C21 9 27 20 19 35Z" fill="#40B63F"/>
                            <path d="M19 35C17 16 27 6 39 3C39 19 30 30 19 35Z" fill="#35A943"/>
                            <path d="M19 35L19 18" stroke="white" stroke-width="1.5"/>
                        </svg>

                        <div>
                            <h4>AQI Live</h4>
                            <p>Live in Mirpur</p>
                        </div>

                    </div>

                    <div class="info-card">

                        <svg viewBox="0 0 40 40" fill="none">
                            <rect x="5" y="24" width="6" height="12" stroke="#27AE42" stroke-width="2.5"/>
                            <rect x="17" y="15" width="6" height="21" stroke="#27AE42" stroke-width="2.5"/>
                            <rect x="29" y="5" width="6" height="31" stroke="#27AE42" stroke-width="2.5"/>
                        </svg>

                        <div>
                            <h4>6 Missions</h4>
                            <p>this week</p>
                        </div>

                    </div>

                    <div class="info-card">

                        <svg viewBox="0 0 40 40" fill="none">
                            <path d="M20 3L34 9V19C34 28 27 34 20 38C13 34 6 28 6 19V9L20 3Z"
                                  stroke="#159B36" stroke-width="2.5"/>
                            <path d="M13 20L18 25L28 14"
                                  stroke="#159B36" stroke-width="2.5"/>
                        </svg>

                        <div>
                            <h4>Moderate</h4>
                            <p>flood risk</p>
                        </div>

                    </div>

                </div>

            </section>

            <section class="login-section">

                <div class="login-card" id="login-card">

                    <h2>Welcome back</h2>

                    <p class="login-description">
                        Sign in to your citizen or organizer account.
                    </p>


                    <form action="#" method="POST">


                        <div class="form-group">

                            <label for="email">
                                Email or phone number
                            </label>

                            <div class="input-box">

                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="3" y="5" width="18" height="14" rx="2"
                                          stroke="currentColor" stroke-width="2"/>
                                    <path d="M4 7L12 13L20 7"
                                          stroke="currentColor" stroke-width="2"/>
                                </svg>

                                <input
                                    type="text"
                                    id="email"
                                    name="email"
                                    autocomplete="username"
                                    placeholder="Enter your email or phone number"
                                    required
                                >

                            </div>

                        </div>

                     <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-box">

                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="5" y="10" width="14" height="11" rx="2"
                                          stroke="currentColor" stroke-width="2"/>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"
                                          stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
                                </svg>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button type="button" class="eye-button"
                                        aria-label="Show password"
                                        aria-pressed="false"
                                        onclick="togglePassword()">

                                    <svg viewBox="0 0 24 24" fill="none">
                                        <path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                              stroke="currentColor" stroke-width="1.8"/>
                                        <circle cx="12" cy="12" r="3"
                                                stroke="currentColor" stroke-width="1.8"/>
                                        <path d="M3 21L21 3"
                                              stroke="currentColor" stroke-width="1.8"/>
                                    </svg>

                                </button>

                            </div>

                        </div>

                        <div class="remember-row">

                            <label>
                                <input type="checkbox" name="remember-me" checked>
                                <span>Keep me signed in</span>
                            </label>

                        </div>


                        <button type="submit" class="sign-in-button">
                            Sign in
                        </button>

                    </form>


                    <div class="divider">
                        <span></span>
                        <p>or</p>
                        <span></span>
                    </div>


                    <div class="create-account">
                        <a href="#">Create an account</a>
                    </div>

                </div>

            </section>

        </main>

        <div class="top-leaf">
            <svg viewBox="0 0 100 110">
                <path d="M5 105C-2 49 25 10 100 1C94 65 53 97 5 105Z"
                      fill="#B8E9AD"/>
            </svg>
        </div>


        <div class="bottom-decoration">

            <svg viewBox="0 0 1440 200" preserveAspectRatio="none">

                <path d="M0 35C180 20 265 150 530 145C840 150 1110 180 1440 55V200H0Z"
                      fill="#E7F8E5"/>

                <path d="M0 130C220 20 365 90 610 145C900 210 1170 145 1440 80V200H0Z"
                      fill="#D2F0CD"/>

                <path d="M0 170C200 75 340 95 560 145C850 215 1200 185 1440 105V200H0Z"
                      fill="#BDE9B7"/>

            </svg>

        </div>


        <div class="bottom-leaf">

            <svg viewBox="0 0 100 100" fill="none">
                <path d="M48 87C8 78 4 49 7 12C40 16 60 43 48 87Z"
                      fill="#70C75A"/>
                <path d="M48 87C43 43 63 12 96 3C94 44 75 73 48 87Z"
                      fill="#55B94A"/>
                <path d="M48 87L46 47"
                      stroke="white" stroke-width="2"/>
            </svg>

        </div>

    </div>

    <script>
        function togglePassword() {

            const password = document.getElementById("password");

            const toggle = document.querySelector(".eye-button");
            const isHidden = password.type === "password";
            if (isHidden) {
                password.type = "text";
            } else {
                password.type = "password";
            }
            toggle.setAttribute("aria-pressed", String(isHidden));
            toggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        }
    </script>

</body>
</html>
